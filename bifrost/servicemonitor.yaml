apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bifrost-sm
  namespace: bifrost
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost
  namespaceSelector:
    matchNames:
      - bifrost
  endpoints:
    - port: http
      interval: 15s
      path: /metrics