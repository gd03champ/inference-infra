apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: baseline-qwen36
spec:
  template:
    metadata:
      labels:
        llm-d.ai/role: baseline-qwen36        # label, matches existing NVDP/DCGM toleration key
        nvidia.com/gpu.present: "true"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6e.16xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu-l40s}
      taints:
        - {key: llm-d.ai/role, value: baseline-qwen36, effect: NoSchedule}   # same key NVDP/DCGM already tolerate
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits: {cpu: 256, memory: 2048Gi, nvidia.com/gpu: 4} # allowing upto 4 pods/instances for KEDA to scale