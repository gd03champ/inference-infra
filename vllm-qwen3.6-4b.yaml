apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen35-4b
  namespace: vllm-deployments
  labels: 
    app: vllm-qwen35-4b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen35-4b
  template:
    metadata:
      labels:
        app: vllm-qwen35-4b
    spec:
      tolerations:
        - {key: llm-d.ai/role, operator: Exists, effect: NoSchedule}
      nodeSelector:
        llm-d.ai/role: decode
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model=Qwen/Qwen3.5-4B"
            - "--reasoning-parser=qwen3"
            - "--max-model-len=131072"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=qwen3_coder"
            - "--tensor-parallel-size=1"
            - "--gpu-memory-utilization=0.7"
          ports: [{containerPort: 8000}]
          resources:
            limits: {nvidia.com/gpu: 1}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen35-4b
  namespace: vllm-deployments
  labels:
    app: vllm-qwen35-4b
spec:
  selector:
    app: vllm-qwen35-4b
  ports: [{port: 8000, targetPort: 8000, name: http}]

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-qwen35-4b
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # <- required, see note below
spec:
  namespaceSelector:
    matchNames: ["vllm-deployments"] # namespace where you deployed the vllm Service
  selector:
    matchLabels: 
      app: vllm-qwen35-4b
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
