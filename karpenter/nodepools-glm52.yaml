apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: baseline-glm52
spec:
  template:
    metadata:
      labels:
        llm-d.ai/role: baseline-glm52        # label, matches existing NVDP/DCGM toleration key
        nvidia.com/gpu.present: "true"
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["p5en.48xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu-h200}
      taints:
        - {key: llm-d.ai/role, value: baseline-glm52, effect: NoSchedule}   # same key NVDP/DCGM already tolerate
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits: {cpu: 192, memory: 2048Gi, nvidia.com/gpu: 8}