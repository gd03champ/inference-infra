apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
spec:
  tolerations:
    - key: llm-d.ai/role
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    llm-d.ai/role: decode
  containers:
    - name: cuda-check
      image: nvidia/cuda:12.4.0-base-ubuntu22.04
      command: ["nvidia-smi"]
  restartPolicy: Never
