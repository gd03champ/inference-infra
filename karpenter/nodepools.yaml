# System pool — CPU only, for gateway, EPP, KEDA, llm-d controller
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: system}
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits: {cpu: 100, memory: 200Gi}
---
# General Prefill pool — GPU, spot-tolerant. 
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: prefill
spec:
  template:
    metadata:
      labels: 
        llm-d.ai/role: prefill
        nvidia.com/gpu.present: "true" #for nvdp ds
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g5.xlarge", "g5.2xlarge", "g6.xlarge", "g6.2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu}
      taints:
        - {key: llm-d.ai/role, value: prefill, effect: NoSchedule}
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits: {cpu: 64, memory: 256Gi, nvidia.com/gpu: 8}
---
# General Decode pool — GPU, on-demand only (mid-generation kills are user-visible)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: decode
spec:
  template:
    metadata:
      labels: 
        llm-d.ai/role: decode
        nvidia.com/gpu.present: "true" #for nvdp ds
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g5.xlarge", "g5.2xlarge", "g6.xlarge", "g6.2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu}
      taints:
        - {key: llm-d.ai/role, value: decode, effect: NoSchedule}
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  limits: {cpu: 64, memory: 256Gi, nvidia.com/gpu: 8}
